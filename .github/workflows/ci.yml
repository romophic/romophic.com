name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Test & Coverage (Vitest)
        shell: bash
        run: |
          if pnpm test:coverage > /tmp/vitest.log 2>&1; then
            tail -n 5 /tmp/vitest.log
          else
            # Raw logs require sign-in; surface the failure lines as
            # annotations, which stay readable for anonymous visitors.
            grep -inE "threshold|error|fail|✕|×" /tmp/vitest.log | head -8 > /tmp/hits.txt || true
            n=0
            while IFS= read -r line; do
              n=$((n+1))
              short="${line:0:400}"
              echo "::error title=vitest-${n}::${short}"
            done < /tmp/hits.txt
            while IFS= read -r line; do
              echo "::error title=vitest-tail::${line:0:400}"
            done < <(tail -n 2 /tmp/vitest.log)
            exit 1
          fi

      - name: Build (Type Check & Astro Build)
        run: pnpm build
