name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Test & Coverage (Vitest)
        shell: bash
        run: |
          set -o pipefail
          if pnpm test:coverage 2>&1 | tee /tmp/vitest.log; then
            echo "vitest passed"
          else
            {
              echo '## Vitest failed — output tail'
              echo '```'
              tail -c 8000 /tmp/vitest.log || true
              echo '```'
              echo "platform: $(uname -a)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build (Type Check & Astro Build)
        run: pnpm build


